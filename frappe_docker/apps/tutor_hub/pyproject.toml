[project]
name = "tutor_hub"
authors = [{ name = "zubbyik" }]
description = "Nigeria's #1 Tutoring Platform — Connect with top tutors"
requires-python = ">=3.10"
readme = "README.md"
version = "0.0.1"

[tool.setuptools.packages.find]
where = ["."]
include = ["tutor_hub*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
