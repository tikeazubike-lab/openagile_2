upstream backend-server {
	server backend:8000 fail_timeout=0;
}

upstream socketio-server {
	server websocket:9000 fail_timeout=0;
}

server {
	listen 8080;
	server_name _;
	root /home/frappe/frappe-bench/sites;
	
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;
	
	add_header X-Frame-Options "SAMEORIGIN";
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
	add_header X-Content-Type-Options nosniff;
	add_header X-XSS-Protection "1; mode=block";
	add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";
	
	set_real_ip_from 127.0.0.1;
	real_ip_header X-Forwarded-For;
	real_ip_recursive off;
	
	# React SPA — served for tutor.zubbystudio.site root
	# All non-API, non-desk routes serve the React app
	location / {
		root /var/www/tutor-connect-hub;
		try_files $uri $uri/ /index.html;
	}
	
	# Frappe desk — proxy to backend
	location /desk {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name $host;
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://backend-server;
	}
	
	# Frappe API — proxy to backend
	location /api {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name $host;
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://backend-server;
	}
	
	# Frappe login/auth — proxy to backend
	location /login {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name $host;
		proxy_set_header Host $host;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://backend-server;
	}
	
	# React SPA assets — check React dist first, then Frappe assets
	location /assets {
		root /var/www/tutor-connect-hub;
		try_files $uri @frappe-assets;
	}
	
	location @frappe-assets {
		root /home/frappe/frappe-bench/sites;
		try_files $uri =404;
	}
	
	location ~ ^/protected/(.*) {
		internal;
		try_files /$host/$1 =404;
	}
	
	# Socket.IO
	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name $host;
		proxy_set_header Origin $scheme://$http_host;
		proxy_set_header Host $host;
		proxy_pass http://socketio-server;
	}
	
	sendfile on;
	keepalive_timeout 15;
	client_max_body_size 50m;
	client_body_buffer_size 16K;
	client_header_buffer_size 1k;
	
	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		application/font-woff
		application/x-web-app-manifest+json
		application/xhtml+xml
		application/xml
		font/opentype
		image/svg+xml
		image/x-icon
		text/css
		text/plain
		text/x-component;
}
